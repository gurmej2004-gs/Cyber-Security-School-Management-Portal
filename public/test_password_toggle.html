<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Password Toggle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .password-container {
            position: relative;
            width: 300px;
        }
        
        .password-container input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            user-select: none;
        }
        
        .toggle-password:hover {
            color: #00d4aa;
        }
        
        .toggle-password.active {
            color: #00d4aa;
        }
        
        .status {
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f5e8;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Test Password Toggle</h1>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <div class="password-container">
            <input type="password" id="password" placeholder="Enter password">
            <span class="toggle-password" id="togglePassword">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </span>
        </div>
    </div>
    
    <div class="status" id="status">
        Password field type: <span id="passwordType">password</span>
    </div>

    <script>
        function setupPasswordToggle() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const statusElement = document.getElementById('passwordType');
            
            console.log('Setting up password toggle...');
            console.log('togglePassword element:', togglePassword);
            console.log('passwordInput element:', passwordInput);
            
            if (togglePassword && passwordInput) {
                console.log('Password toggle elements found');
                
                // Update status display
                function updateStatus() {
                    statusElement.textContent = passwordInput.type;
                    console.log('Password type changed to:', passwordInput.type);
                }
                
                // Mouse events for desktop
                togglePassword.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    passwordInput.type = 'text';
                    this.classList.add('active');
                    console.log('Password shown (mousedown)');
                    updateStatus();
                });
                
                togglePassword.addEventListener('mouseup', function(e) {
                    e.preventDefault();
                    passwordInput.type = 'password';
                    this.classList.remove('active');
                    console.log('Password hidden (mouseup)');
                    updateStatus();
                });
                
                togglePassword.addEventListener('mouseleave', function(e) {
                    e.preventDefault();
                    passwordInput.type = 'password';
                    this.classList.remove('active');
                    console.log('Password hidden (mouseleave)');
                    updateStatus();
                });
                
                // Click event for mobile and toggle
                togglePassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        this.classList.add('active');
                        console.log('Password shown (click)');
                    } else {
                        passwordInput.type = 'password';
                        this.classList.remove('active');
                        console.log('Password hidden (click)');
                    }
                    updateStatus();
                });
                
                // Initial status update
                updateStatus();
                
            } else {
                console.log('Password toggle elements not found:', {
                    togglePassword: !!togglePassword,
                    passwordInput: !!passwordInput
                });
            }
        }
        
        // Setup password toggle when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupPasswordToggle);
        } else {
            setupPasswordToggle();
        }
    </script>
</body>
</html>
